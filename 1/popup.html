<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Adult Site Blocker</h1>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <p id="status" class="status"></p>

  <button id="block-current" class="primary">Block this site</button>

  <div class="row">
    <input id="new-site" type="text" placeholder="example.com">
    <button id="add-site">Add</button>
  </div>
  <p id="error" class="error"></p>

  <label class="check"><input type="checkbox" id="keywords"> Block pages containing adult keywords</label>
  <label class="check"><input type="checkbox" id="pattern-on"> Block look-alike domains (pattern matching)</label>

  <h2>Your blocked sites</h2>
  <ul id="site-list"></ul>

  <h2>Your blocked patterns</h2>
  <p class="hint">Matched against the hostname, e.g. <code>xvideos</code> also blocks xvideos2.net. Regex allowed.</p>
  <div class="row">
    <input id="new-pattern" type="text" placeholder="brandname or regex">
    <button id="add-pattern">Add</button>
  </div>
  <p id="pattern-error" class="error"></p>
  <ul id="pattern-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
